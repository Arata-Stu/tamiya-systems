/**:
  ros__parameters:
    ## スロットルとステアリングの反転
    throttle_inversion: True
    steering_inversion: False
    ## スロットルとステアリングのゲイン
    throttle_gain: 1.0
    steering_gain: 1.0
    ## ESC/モータ保護用の正規化スロットル制限
    max_throttle: 0.7
    max_throttle_slew_rate: 1.0  # normalized throttle / sec
    ## スロットルとステアリングのオフセット
    steering_offset: 0.0
    throttle_offset: 0.0
    ## スロットルとステアリングのオフセット調整ステップ
    offset_step: 0.000
    ## ニュートラル継続時に短い後進パルスを入れてESCの停止判定を助ける
    neutral_stop_assist_enabled: True
    neutral_stop_required_steps: 10
    neutral_stop_reverse_start: -0.01
    neutral_stop_reverse_end: -0.08
    neutral_stop_reverse_step: -0.01
