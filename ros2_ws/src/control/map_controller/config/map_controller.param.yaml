/**:
  ros__parameters:
    # The controller assumes the reference points are already expressed in
    # this local vehicle frame. No TF transform is applied.
    expected_frame_id: base_link

    # Vehicle geometry [m]. Used by the kinematic fallback when no lookup
    # table is available.
    wheelbase: 0.26
    min_kinematic_speed_for_steer: 0.20

    # Ignore predicted points behind or too close to base_link.
    min_forward_distance: 0.02

    # L1 distance = clamp(q_l1 + m_l1 * speed, lower_bound, t_clip_max)
    # where lower_bound = max(t_clip_min, sqrt(2) * lateral_error).
    m_l1: 0.60
    q_l1: 0.20
    t_clip_min: 0.35
    t_clip_max: 1.20

    # Delay compensation [s].
    speed_lookahead: 0.25
    speed_lookahead_for_steer: 0.00

    # Longitudinal control.
    min_speed: 0.10
    max_speed: 0.30
    fallback_speed: 0.25
    lat_err_coeff: 1.00
    lateral_error_clip_m: 0.50
    curvature_normalization: 0.80
    curvature_window_points: 20

    # Steering limits [rad]. max_steering_delta limits command jumps per
    # trajectory callback.
    steering_limit: 0.45
    max_steering_delta: 0.12

    # Optional steering scaling based on longitudinal acceleration estimated
    # from odometry speed and on reference speed.
    acc_scaler_for_steer: 1.00
    dec_scaler_for_steer: 1.00
    accel_scale_threshold: 1.00
    decel_scale_threshold: -1.00
    start_scale_speed: 10.00
    end_scale_speed: 11.00
    downscale_factor: 0.00

    # Lookup table CSV generated by build_map_steering_lookup.py.
    # Empty path: use kinematic fallback steering conversion.
    lookup_table_csv_path: ""
    use_lookup_table: true

    # true: publish stop command if no usable reference point is available.
    # false: hold the previous command.
    stop_on_invalid_reference: true

    # Publish RViz markers:
    # - map_controller/nearest_marker: nearest reference point
    # - map_controller/lookahead_marker: selected L1 target
    # - map_controller/lookahead_line_marker: line from base_link to target
    debug: false
