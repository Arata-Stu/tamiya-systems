/**:
  ros__parameters:
    loc_result_frame: "map"

    robot_radius: 0.25
    max_beam_error: 0.5
    max_output_error: 0.35
    min_output_error: 0.22

    num_beams_gpu: 256
    batch_size: 64
    sample_distance: 0.1

    out_of_range_threshold: 12.5
    invalid_range_threshold: 0.05
    min_scan_fov_degrees: 250.0
    use_closest_beam: true

    max_points: 512
    use_gxf_map_convention: false

    input_qos: "SENSOR_DATA"
    output_qos: "DEFAULT"
