/**:
  ros__parameters:
    localization_trigger_topic: "/localization/trigger"
    localization_trigger_service: "/trigger_grid_search_localization"
    localization_result_topic: "/localization_result"
    localization_feedback_timeout_sec: 0.0
    use_amcl_pose: false
    amcl_pose_topic: "/amcl_pose"
    # "once", "continuous", or "never".
    # "once" applies the first accepted AMCL pose after startup or a global localization refresh.
    amcl_pose_update_mode: "once"
    # Negative thresholds disable AMCL covariance rejection.
    amcl_pose_max_xy_variance: -1.0
    amcl_pose_max_yaw_variance: -1.0
    publish_initialpose_to_amcl: false
    initial_pose_topic: "/initialpose"

    # TF bridge settings
    publish_localization_tf: true
    # "map_to_odom" or "map_to_base_link"
    localization_tf_mode: "map_to_odom"
    localization_tf_map_frame: "map"
    localization_tf_odom_frame: "odom"
    localization_tf_base_frame: "base_link"
    localization_tf_publish_rate_hz: 20.0
