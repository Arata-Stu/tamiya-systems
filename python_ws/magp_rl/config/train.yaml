defaults:
  - agent: sac
  - vehicle: tamiya
  - _self_

train:
  seed: 42
  total_timesteps: 10000000
  num_envs: 128
  num_agents: null # legacy alias (prefer num_envs)
  max_episode_steps: 10000
  quiet_absl: true

  tensorboard:
    enabled: true
    log_dir: ./logs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    log_every_updates: 1

  checkpoint:
    dir: ./ckpts/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    save_every_updates: 10
    keep: 3
    resume: false
    auto_fork_on_resume: false # true: resume時にckpt dirを自動複製して元runの上書きを防ぐ

env:
  parallel:
    mode: independent # independent | race

  race:
    control_mode: selfplay # selfplay | npc
    num_agents: null # if null, use train.num_envs
    ego_idx: 0
    npc:
      controller: pure_pursuit # pure_pursuit
      speed_scale: 0.6 # npc only: scale for non-ego target speed (e.g. 0.9)

  track:
    root: '../f1tenth_racetracks'
    name: 'BrandsHatch'
    line_type: 'centerline' # centerline | raceline

  map_path: null
  map_ext: '.png'
  waypoints_path: null

  max_steer: 0.4
  min_steer: -0.4
  max_speed: 5.0
  min_speed: 0.0
  max_lidar_range: 12.0 # T-mini Plus profile
  obs_dim: 320 # T-mini Plus profile
  scan_beams: 320 # T-mini Plus profile
  scan_angle_min: -2.343 # T-mini Plus profile
  scan_angle_max: 2.343 # T-mini Plus profile
  scan_fov: null # if null, use (scan_angle_max - scan_angle_min)
  control_interface: local_trajectory_pp # direct | local_trajectory_pp
  action_dim: 6

  trajectory:
    # Used only when control_interface=local_trajectory_pp.
    # In that mode the actor outputs 6 normalized Bezier control values and
    # the env converts the sampled local trajectory to steer/speed by pure pursuit.
    num_points: 20
    x_anchors: [0.4, 1.0, 1.8]
    x_offset_scale: 0.25
    y_scale: 0.55
    min_control_dx: 0.05
    wheelbase: 0.3302
    lookahead_base: 0.35
    lookahead_gain: 0.35
    lookahead_min: 0.35
    lookahead_max: 1.2
    min_forward_distance: 0.05
    steering_limit: 0.4
    min_speed: 0.0
    max_speed: null # nullならenv.max_speed
    curvature_speed_gain: 1.5
    steering_speed_gain: 1.0
    short_path_speed_scale: 0.6
    reward:
      smoothness_coef: 0.04
      tail_smoothness_coef: 0.12
      tail_smoothness_power: 2.5
      lateral_coef: 0.04
      terminal_lateral_coef: 0.6
      terminal_heading_coef: 0.25
      centerline_coef: 0.9
      centerline_horizon: 1.8
      centerline_forward_weight: 0.25
      centerline_lateral_weight: 1.0
      centerline_tail_power: 1.5

  reward:
    base_reward_scale: 1.0
    progress_coef: 1.0
    speed_coef: 0.02
    collision_penalty: 1.0
    progress_clip: 0.5
    tal:
      enabled: false
      coef: 0.1
      steer_weight: 1.0
      speed_weight: 0.25
      lookahead_distance: 0.5
      lookahead_gain: 0.3 # lookahead = lookahead_distance + lookahead_gain * speed[m/s]
      wheelbase: 0.3302
      vgain: 1.0
      default_speed_mps: 2.0
      speed_profile:
        mode: file_or_curvature # file | curvature | file_or_curvature
        min_speed_mps: 0.5
        max_speed_mps: null # nullならenv.max_speed
        max_lateral_accel_mps2: 3.0
        smoothing_window: 9
      schedule:
        enabled: false
        mode: linear # linear | cosine
        start_step: 0
        decay_steps: 1000000
        coef_min: 0.0

eval:
  checkpoint_dir: null
  episodes: 5
  max_steps: 2000
  num_envs: 1
  num_agents: null # legacy alias (prefer num_envs)

hydra:
  run:
    dir: ./outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
