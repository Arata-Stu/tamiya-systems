defaults:
  - agent: ppo
  - _self_

train:
  seed: 42
  total_timesteps: 1000000
  num_agents: 10
  max_episode_steps: 2000
  quiet_absl: true

  tensorboard:
    enabled: true
    log_dir: ./logs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    log_every_updates: 1

  checkpoint:
    dir: ./ckpts/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    save_every_updates: 10
    keep: 3
    resume: false

env:
  track:
    root: '../f1tenth_racetracks'
    name: 'Austin'
    line_type: 'centerline' # centerline | raceline

  map_path: null
  map_ext: '.png'
  waypoints_path: null

  max_steer: 0.4
  min_steer: -0.4
  max_speed: 5.0
  min_speed: 0.0
  max_lidar_range: 10.0
  obs_dim: 1080
  action_dim: 2

  reward:
    base_reward_scale: 1.0
    progress_coef: 1.0
    speed_coef: 0.02
    collision_penalty: 1.0
    progress_clip: 0.5

eval:
  checkpoint_dir: null
  episodes: 5
  max_steps: 2000
  num_agents: 1

hydra:
  run:
    dir: ./outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
