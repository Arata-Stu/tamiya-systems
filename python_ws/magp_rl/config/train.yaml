train:
  seed: 42
  total_timesteps: 1000000
  num_steps: 2048
  num_agents: 10
  update_epochs: 4
  actor_lr: 3.0e-4
  critic_lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01

  tensorboard:
    enabled: true
    log_dir: ./logs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
    log_every_updates: 1

  checkpoint:
    dir: ckpts
    save_every_updates: 10
    keep: 3
    resume: false

env:
  # Minimal setup: choose a track and line_type only.
  track:
    root: '../f1tenth_racetracks'
    name: 'Austin'
    line_type: 'centerline' # centerline | raceline

  # Optional explicit override (leave null to auto-resolve from env.track)
  map_path: null
  map_ext: '.png'
  waypoints_path: null

  max_steer: 0.4
  min_steer: -0.4
  max_speed: 5.0
  min_speed: 0.0
  max_lidar_range: 10.0
  obs_dim: 1080
  action_dim: 2

  reward:
    base_reward_scale: 1.0
    progress_coef: 1.0
    speed_coef: 0.02
    collision_penalty: 1.0
    progress_clip: 0.5

eval:
  checkpoint_dir: ckpts
  episodes: 5
  max_steps: 2000
  num_agents: 1

hydra:
  run:
    dir: ./outputs/train/${now:%Y-%m-%d}/${now:%H-%M-%S}
