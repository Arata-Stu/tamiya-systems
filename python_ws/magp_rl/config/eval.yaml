defaults:
  - agent: ppo
  - vehicle: tamiya
  - _self_

env:
  parallel:
    mode: independent # independent | race

  track:
    root: '../f1tenth_racetracks'
    name: 'Austin'
    line_type: 'centerline' # centerline | raceline

  map_path: null
  map_ext: '.png'
  waypoints_path: null

  max_steer: 0.4
  min_steer: -0.4
  max_speed: 5.0
  min_speed: 0.0
  max_lidar_range: 12.0 # T-mini Plus profile
  obs_dim: 320 # T-mini Plus profile
  scan_beams: 320 # T-mini Plus profile
  scan_angle_min: -2.343 # T-mini Plus profile
  scan_angle_max: 2.343 # T-mini Plus profile
  scan_fov: null # if null, use (scan_angle_max - scan_angle_min)
  action_dim: 2

  reward:
    base_reward_scale: 1.0
    progress_coef: 1.0
    speed_coef: 0.02
    collision_penalty: 1.0
    progress_clip: 0.5
    tal:
      enabled: true
      coef: 0.1
      steer_weight: 1.0
      speed_weight: 0.25
      lookahead_distance: 0.5
      lookahead_gain: 0.3 # lookahead = lookahead_distance + lookahead_gain * speed[m/s]
      wheelbase: 0.3302
      vgain: 1.0
      default_speed_mps: 2.0
      speed_profile:
        mode: file_or_curvature # file | curvature | file_or_curvature
        min_speed_mps: 0.5
        max_speed_mps: null # nullならenv.max_speed
        max_lateral_accel_mps2: 3.0
        smoothing_window: 9
      schedule:
        enabled: true
        mode: linear # linear | cosine
        start_step: 0
        decay_steps: 1000000
        coef_min: 0.0

eval:
  seed: 42
  checkpoint_dir: null
  episodes: 5
  max_steps: 2000
  num_envs: 1
  num_agents: null # legacy alias (prefer num_envs)
  video:
    enabled: false
    output_dir: ./records/eval/${now:%Y-%m-%d}/${now:%H-%M-%S}
    filename_prefix: rollout
    fps: 20
    sync_to_sim_time: true
    sim_dt_override: null
    size: 900
    margin_m: 20.0
    color_by_speed: true
    speed_min_mps: 0.0
    speed_max_mps: 5.0

hydra:
  run:
    dir: ./outputs/eval/${now:%Y-%m-%d}/${now:%H-%M-%S}
